name: Bug report
description: Report a malfunction of the SMSGateway integration
labels: [bug]
body:
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.9.0"
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: SMS Gateway for Android version
      description: "1.74.1 or later — MMS sending does not exist in earlier versions."
      placeholder: "1.74.1"
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: App build
      options:
        - secure
        - insecure
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Gateway mode
      options:
        - Local Server
        - Public Cloud
        - Private Server
      description: "The integration targets Local Server; other modes are untested."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: What happened? What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Enable debug logging in `configuration.yaml`:
        ```yaml
        logger:
          default: info
          logs:
            custom_components.smsgate: debug
            homeassistant.components.webhook: debug
        ```
        Restart, reproduce the problem, then paste the relevant lines.

        ⚠️ Debug logs contain the **text of your messages** and base64
        attachments. Anonymise before posting, and switch back to `info`
        afterwards.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed `custom_components/smsgate/__pycache__` and restarted after upgrading
        - label: My Home Assistant external URL is HTTPS with a valid certificate
        - label: The app is set as the phone's default SMS app
